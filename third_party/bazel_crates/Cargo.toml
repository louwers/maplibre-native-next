[package]
name = "mln-rs-bazel-crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The third-party crates that only Bazel targets outside this workspace use
# (difftests, tools, platform/glfw). As dev-dependencies of this empty
# package they are resolved and locked with the rest of the workspace, which
# is where Bazel gets its crates (MODULE.bazel), but Cargo never builds them:
# the package has no tests.
publish = false

[lib]
name = "bazel_crates"
test = false
doctest = false

[dev-dependencies]
# Evaluated as a replacement for //vendor/earcut and rejected: on polygons
# with holes it differs from the C++ earcut.hpp (25% identical, 1.1% cover a
# different area; see //difftest/earcut_crate). Only that comparison uses it,
# so a newer release can be re-checked.
earcut = { version = "0.4.5" }
# platform/glfw: links the GLFW from the dev shell (dynamic-link) instead of
# downloading prebuilt libraries in a build script; raw window handles give
# wgpu its surface.
glfw = { version = "0.63.0", default-features = false, features = ["dynamic-link", "raw-window-handle-v0-6", "wayland", "x11"] }
# The difftests' property tests.
proptest = { version = "1.12.0" }
# tools/render-test's JSON (with serde_json).
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true
