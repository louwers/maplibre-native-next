# `cargo test` (README.md): the tests find their data as Bazel lays it out
# for them, under $TEST_SRCDIR/maplibre+ (the C++ repository). runfiles/
# mirrors that with a symlink to ../maplibre-native.
#
# One test at a time per test binary: mln_actor_gtest's tests share the
# background scheduler and can hang in parallel (Bazel passes
# --test-threads=1 to it). The whole suite still takes under a minute.
[env]
RUST_TEST_THREADS = "1"
TEST_SRCDIR = { value = ".cargo/runfiles", relative = true }
RUNFILES_DIR = { value = ".cargo/runfiles", relative = true }
