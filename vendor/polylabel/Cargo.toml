[package]
name = "mln-rs-polylabel"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below are the BUILD.bazel rust_tests; tests/ also holds
# their modules.
autotests = false

[lib]
name = "polylabel"
# Bazel never runs doctests.
doctest = false

[dependencies]
geometry.workspace = true
libstdcxx.workspace = true

[[test]]
name = "polylabel_fixtures_test"
path = "tests/polylabel.rs"

[dev-dependencies]
serde_json.workspace = true
