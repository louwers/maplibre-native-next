[package]
name = "mln-rs-supercluster"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below are the BUILD.bazel rust_tests; tests/ also holds
# their modules.
autotests = false

[lib]
name = "supercluster"
# Bazel never runs doctests.
doctest = false

[dependencies]
kdbush.workspace = true
libstdcxx.workspace = true
maplibre_native_base.workspace = true

[[test]]
name = "supercluster_fixtures_test"
path = "tests/supercluster.rs"

[dev-dependencies]
serde_json.workspace = true
