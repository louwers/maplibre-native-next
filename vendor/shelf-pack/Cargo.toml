[package]
name = "mln-rs-shelf-pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below are the BUILD.bazel rust_tests; tests/ also holds
# their modules.
autotests = false

[lib]
name = "shelf_pack"
# Bazel never runs doctests.
doctest = false

[[test]]
name = "shelf_pack_unit_test"
path = "tests/shelf_pack.rs"

[lints]
workspace = true
