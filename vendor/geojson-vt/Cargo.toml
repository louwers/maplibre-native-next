[package]
name = "mln-rs-geojson-vt"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below are the BUILD.bazel rust_tests; tests/ also holds
# their modules.
autotests = false

[lib]
name = "geojson_vt"
# Bazel never runs doctests.
doctest = false

[dependencies]
feature.workspace = true
geojson.workspace = true
geometry.workspace = true
libstdcxx.workspace = true

[[test]]
name = "geojsonvt_test"
path = "tests/geojsonvt.rs"

[[test]]
name = "geojsonvt_fixtures_test"
path = "tests/fixtures.rs"

[dev-dependencies]
serde_json.workspace = true
