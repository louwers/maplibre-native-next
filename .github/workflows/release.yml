name: release

# Publishes the workspace in Cargo.toml to crates.io at its version: mln-rs
# and the mln-rs-* libraries it re-exports. Then tags the commit v<version>
# and creates a GitHub release. See RELEASING.md. Rerunning after a partial
# failure finishes the job: packages crates.io already has at this version
# are skipped.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the tag and the GitHub release

jobs:
  release:
    runs-on: ubuntu-26.04
    # The publish step waits out crates.io's limit on new crates, which the
    # first release of new packages runs into.
    timeout-minutes: 360
    steps:
      - name: Require the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Run the release from ${{ github.event.repository.default_branch }}."
          exit 1

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "mln-rs") | .version')
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Builds each package from its packaged sources. Packages resolve each
      # other locally, so this works before any of them is on crates.io.
      - name: Package
        run: cargo package --workspace --locked

      # In dependency order, waiting for each to reach the index. Package
      # verified these exact packages, so skip the second build. A 429 is
      # crates.io's limit on new crates: wait, then publish the rest.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          USER_AGENT: mln-rs-release (https://github.com/louwers/maplibre-native-next)
        run: |
          set -o pipefail
          packages=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[].name')
          while true; do
            skip=()
            for package in $packages; do
              if curl -sf -o /dev/null -A "$USER_AGENT" "https://crates.io/api/v1/crates/$package/$VERSION"; then
                skip+=("--exclude=$package")
              fi
            done
            if [[ ${#skip[@]} == $(wc -w <<< "$packages") ]]; then
              echo "crates.io has every package at $VERSION."
              break
            fi
            if cargo publish --workspace --locked --no-verify "${skip[@]}" 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
              break
            fi
            grep -q "status 429" "$RUNNER_TEMP/publish.log" || exit 1
            echo "Rate-limited by crates.io; retrying in 10 minutes."
            sleep 600
          done

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The $tag release exists."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "https://crates.io/crates/mln-rs/$VERSION" \
            target/package/*.crate
