[package]
name = "mln-rs-gfx"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below are the BUILD.bazel rust_tests; tests/ also holds
# their modules.
autotests = false

[lib]
name = "mln_gfx"
# Bazel never runs doctests.
doctest = false

[dependencies]
bytemuck.workspace = true
geometry.workspace = true
mln_style_types.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true

[[test]]
name = "shader_registry_test"
path = "tests/shader_registry.rs"

[[test]]
name = "gtest_renderable"
path = "tests/gtest_renderable.rs"

[[test]]
name = "gtest_backend_scope"
path = "tests/gtest_backend_scope.rs"

[[test]]
name = "gtest_metal_renderable"
path = "tests/gtest_metal_renderable.rs"

[[test]]
name = "gtest_vulkan_acquire"
path = "tests/gtest_vulkan_acquire.rs"

[[test]]
name = "gtest_hash"
path = "tests/gtest_hash.rs"
