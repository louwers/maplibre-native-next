[package]
name = "mln-rs-platform-default"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below are the BUILD.bazel rust_tests; tests/ also holds
# their modules.
autotests = false

[lib]
name = "mln_platform_default"
# Bazel never runs doctests.
doctest = false

[dependencies]
mln_actor.workspace = true
mln_gfx.workspace = true
mln_map.workspace = true
mln_renderer.workspace = true
mln_util.workspace = true
mln_webgpu.workspace = true

[[test]]
name = "m1_background_render_test"
path = "tests/m1_background_render_test.rs"

[[test]]
name = "local_glyph_rasterizer_test"
path = "tests/local_glyph_rasterizer_test.rs"

[[test]]
name = "gtest_feature_tracking"
path = "tests/gtest_feature_tracking.rs"

[[test]]
name = "gtest_map"
path = "tests/gtest_map.rs"

[[test]]
name = "gtest_api"
path = "tests/gtest_api.rs"

[[test]]
name = "gtest_memory"
path = "tests/gtest_memory.rs"

[dev-dependencies]
feature = { package = "mln-rs-feature", path = "../../vendor/feature" }
geojson = { package = "mln-rs-geojson", path = "../../vendor/geojson" }
mln_map_types = { package = "mln-rs-map-types", path = "../mln_map_types" }
mln_math = { package = "mln-rs-math", path = "../mln_math" }
mln_platform_default_image = { package = "mln-rs-platform-default-image", path = "../mln_platform_default_image" }
mln_storage = { package = "mln-rs-storage", path = "../mln_storage" }
mln_style = { package = "mln-rs-style", path = "../mln_style" }
pixelmatch = { package = "mln-rs-pixelmatch", path = "../../vendor/pixelmatch" }
serde_json.workspace = true

[lints]
workspace = true
