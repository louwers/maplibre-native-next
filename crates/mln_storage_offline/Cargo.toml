[package]
name = "mln-rs-storage-offline"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below are the BUILD.bazel rust_tests; tests/ also holds
# their modules.
autotests = false

[lib]
name = "mln_storage_offline"
# Bazel never runs doctests.
doctest = false

[dependencies]
feature.workspace = true
mln_actor.workspace = true
mln_conversion.workspace = true
mln_renderer.workspace = true
mln_storage.workspace = true
mln_style.workspace = true
mln_style_types.workspace = true
mln_text.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
regex.workspace = true

[[test]]
name = "offline_download_map_test"
path = "tests/offline_download_map.rs"

[dev-dependencies]
mln_map = { package = "mln-rs-map", path = "../mln_map" }
mln_platform_default = { package = "mln-rs-platform-default", path = "../mln_platform_default" }
mln_platform_default_image = { package = "mln-rs-platform-default-image", path = "../mln_platform_default_image" }

[lints]
workspace = true
