[package]
name = "mln-rs-storage"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The tests run under Bazel (BUILD.bazel).
autotests = false

[lib]
name = "mln_storage"

[dependencies]
geojson.workspace = true
maplibre_native_base.workspace = true
mln_actor.workspace = true
mln_platform_default_image.workspace = true
mln_util.workspace = true
pmtiles.workspace = true
rapidjson.workspace = true
rusqlite.workspace = true
serde_json.workspace = true

# ureq's TLS (rustls, ring) doesn't build for Emscripten, where the
# storage fetches through the browser instead.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
ureq.workspace = true
